name: release

on:
  push:
    tags:
      - v*
    branches:
      - master
    paths:
      - .github/workflows/release.yaml
      - internal/**
      - go.*
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/release.yaml
      - internal/**
      - go.*

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}--${{ github.ref }}

jobs:
  create:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    outputs:
      release-name: ${{ steps.create-draft-release.outputs.release-name }}
    permissions:
      contents: write
    steps:
      - id: create-draft-release
        uses: int128/create-draft-release-action@0cdd1b9d8001d6b3e137a4c01f5d621b699c3b24 # v0.8.0
        with:
          dry-run: ${{ github.event_name == 'pull_request' }}

  build:
    needs: create
    strategy:
      matrix:
        platform:
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: amd64
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: arm64
          - runs-on: ubuntu-latest
            GOOS: linux
            GOARCH: arm
          - runs-on: ubuntu-latest
            GOOS: darwin
            GOARCH: amd64
          - runs-on: ubuntu-latest
            GOOS: darwin
            GOARCH: arm64
          - runs-on: ubuntu-latest
            GOOS: windows
            GOARCH: amd64
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      GOOS: ${{ matrix.platform.GOOS }}
      GOARCH: ${{ matrix.platform.GOARCH }}
      CGO_ENABLED: 0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go build -ldflags "-X main.version=$GITHUB_SHA"
      - uses: int128/go-release-action@9e1d6ec29fc6ffc2ba55f631baf4a73017d228e1 # v2.5.0
        with:
          binary: kauthproxy
          release-name: ${{ needs.create.outputs.release-name }}
