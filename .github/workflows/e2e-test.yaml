name: e2e-test

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/e2e-test.yaml
      - internal/**
      - e2e_test/**
      - go.*
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/e2e-test.yaml
      - internal/**
      - e2e_test/**
      - go.*

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.62.3
          working_directory: e2e_test
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make -C e2e_test -j3

      - if: github.event_name == 'pull_request'
        run: gh pr comment "$number" --attach e2e_test/output/screenshot.png --body "$body"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ github.event.pull_request.number }}
          body: |-
            ## e2e-test
            ![screenshot](e2e_test/output/screenshot.png)
